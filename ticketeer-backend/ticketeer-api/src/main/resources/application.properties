spring.application.name=ticketeer
#server.port=8090
server.port=@server.port@

#Database Configurations
#podman run -idt --name postgres-ticketeer -p 5432:5432 -e POSTGRES_USER=ticketeer_db -e POSTGRES_PASSWORD=ticketeer -e POSTGRES_DB=ticketeer_main postgres:15.15-trixie
#spring.datasource.url=jdbc:postgresql://192.168.0.196:5432/ticketeer_main
spring.datasource.url=@db.url@
spring.datasource.username=@db.username@
spring.datasource.password=@db.password@
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=@db.schema.management@
spring.jpa.show-sql=true

#Check before moving to PRD
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.resource.transaction=TRACE

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Caching configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379
#Cache TTL in minutes
default.cache.ttl=60